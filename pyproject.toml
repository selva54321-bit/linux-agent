[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-agent"
version = "0.1.0"
description = "Linux AI Agent"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "google-genai>=2.15.0",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.10",
    "pexpect>=4.9.0",
    "pydantic>=2.13.4",
]

[project.scripts]
agent = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["agent", "tools"]